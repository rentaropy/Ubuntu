services:
  # --- CPU版 (プロファイル: cpu) ---
  spyder:
    build: ./spyder
    container_name: docker-spyder
    profiles: ["spyder-cpu"]  # ★ここがポイント
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg
      - ./spyder/workspace:/home/ubuntu/workspace
    environment:
      - DISPLAY=$DISPLAY
      - WAYLAND_DISPLAY=$WAYLAND_DISPLAY
      - XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR
      - PULSE_SERVER=$PULSE_SERVER
      - HOME=/home/ubuntu
    shm_size: '2gb'
    tty: true

  # --- GPU版 (プロファイル: gpu) ---
  spyder-gpu:
    build: ./spyder-gpu
    container_name: docker-spyder-gpu
    profiles: ["spyder-gpu"]  # ★ここがポイント
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg
      # フォルダ構成に合わせてGPU用のワークスペースをマウント
      - ./spyder-gpu/workspace:/home/ubuntu/workspace
    environment:
      - DISPLAY=$DISPLAY
      - WAYLAND_DISPLAY=$WAYLAND_DISPLAY
      - XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR
      - PULSE_SERVER=$PULSE_SERVER
      - HOME=/home/ubuntu
      # NVIDIA関連の環境変数
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
    shm_size: '4gb' # GPU用に少し大きめに確保
    tty: true
  minimal:
    build: ./minimal
    container_name: docker-minimal
    profiles: ["minimal"]
    volumes:
      - ./minimal/workspace:/home/ubuntu/workspace
    # GUIアプリを使わないため Display 関連の変数は不要
    environment:
      - HOME=/home/ubuntu
    # VSCodeが接続できるようにコンテナを常駐させる
    command: sleep infinity
    tty: true

  # --- Minimal GPU版 (プロファイル: minimal-gpu) ---
  minimal-gpu:
    build: ./minimal-gpu
    container_name: docker-minimal-gpu
    profiles: ["minimal-gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./minimal-gpu/workspace:/home/ubuntu/workspace
    environment:
      - HOME=/home/ubuntu
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    # VSCodeが接続できるようにコンテナを常駐させる
    command: sleep infinity
    tty: true