services:
  dev:
    build:
      context: ./dev
      args:
        - ENVIRONMENT=${ENVIRONMENT:-spyder-gpu}
    container_name: docker-dev-${ENVIRONMENT:-spyder-gpu}
    profiles: ["dev"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility, graphics]
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg
      - ./dev/workspace:/home/ubuntu/workspace
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/mnt/wslg/runtime-dir}
      - PULSE_SERVER=${PULSE_SERVER:-/mnt/wslg/PulseServer}
      - HOME=/home/ubuntu
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      - ENVIRONMENT=${ENVIRONMENT:-spyder-gpu} # minimal, minimal-gpu, spyder, spyder-gpu
    shm_size: '4gb'
    tty: true
